<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Keyway</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("keyway_theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/i18n.js"></script>
</head>
<body>
  <div class="center-page">
    <div class="card login-card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:0.75rem;">
        <select id="login-lang" class="select" style="width:auto;padding:0.3rem 0.5rem;font-size:0.8rem;" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <div class="brand">
        <img src="/assets/logo.svg" width="56" height="56" alt="Keyway" />
        <div class="name">Keyway</div>
        <div class="tagline" data-i18n="login.tagline">LLM Routing Gateway</div>
      </div>
      <h1 data-i18n="login.title">Admin Login</h1>
      <p class="subtitle" data-i18n="login.subtitle">Enter your admin token to access the management UI.</p>
      <form id="login-form">
        <div class="field">
          <label for="token" data-i18n="login.token">Admin Token</label>
          <input class="input mono" type="password" id="token" name="token" data-i18n-placeholder="login.placeholder" placeholder="Paste your KEYWAY_ADMIN_TOKEN here" required autocomplete="off" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;" data-i18n="login.submit">Login</button>
        <div class="form-error" id="status"></div>
      </form>
      <p class="hint" data-i18n="login.hint">
        The admin token is set via KEYWAY_ADMIN_TOKEN in your .env. If not set, a random token is printed to the console on startup. Desktop mode skips this screen on loopback.
      </p>
    </div>
  </div>
  <script type="module">
    const form = document.getElementById("login-form");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("login-submit");
    const langSel = document.getElementById("login-lang");
    const t = (k) => (window.KeywayI18n ? KeywayI18n.t(k) : k);

    async function bootstrapLang() {
      let lang = window.KeywayI18n ? KeywayI18n.loadStoredLanguage() : "en";
      try {
        const resp = await fetch("/admin/ui-locale");
        if (resp.ok) {
          const data = await resp.json();
          if (data.language) lang = data.language;
        }
      } catch (_) {}
      if (window.KeywayI18n) KeywayI18n.setLanguage(lang);
      if (langSel) langSel.value = window.KeywayI18n ? KeywayI18n.getLanguage() : lang;
    }

    langSel?.addEventListener("change", () => {
      if (window.KeywayI18n) KeywayI18n.setLanguage(langSel.value);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = document.getElementById("token").value;
      status.textContent = "";
      submitBtn.disabled = true;
      try {
        const resp = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (resp.ok) {
          window.location.href = "/admin.html";
        } else {
          const data = await resp.json().catch(() => ({}));
          status.textContent = data.detail || t("login.failed");
        }
      } catch (err) {
        status.textContent = t("login.networkError") + ": " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    bootstrapLang();
  </script>
</body>
</html>
