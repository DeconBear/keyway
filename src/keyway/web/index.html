<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Keyway</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="/assets/i18n.js"></script>
  <style>
    :root { --bg: #fafafa; --card: #fff; --border: #e0e0e0; --text: #111; --muted: #6b6b6b; --accent: #111; --err: #b00; --ok: #0a6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --card: #161616; --border: #2a2a2a; --text: #f0f0f0; --muted: #8a8a8a; --accent: #f0f0f0; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem 2.5rem; width: 100%; max-width: 400px; }
    .login-card h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.3rem; }
    .login-card .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }
    .login-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
    .login-card input { width: 100%; padding: 0.6rem 0.8rem; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; }
    .login-card button { width: 100%; margin-top: 1rem; padding: 0.65rem; font-size: 0.9rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: var(--bg); cursor: pointer; font-family: inherit; }
    .login-card button:hover { opacity: 0.85; }
    .login-card .status { font-size: 0.82rem; color: var(--err); margin-top: 0.8rem; text-align: center; }
    .login-card .hint { font-size: 0.78rem; color: var(--muted); margin-top: 1rem; line-height: 1.5; }
    .brand { text-align: center; margin-bottom: 1.5rem; }
    .brand img.logo { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 0.75rem; }
    .brand .name { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
    .brand .tagline { font-size: 0.78rem; color: var(--muted); }
    .lang-row { display:flex; justify-content:flex-end; margin-bottom: 0.75rem; }
    .lang-row select { font-size: 0.8rem; padding: 0.25rem 0.4rem; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lang-row">
      <select id="login-lang" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <div class="brand">
      <img class="logo" src="/assets/logo.svg" width="56" height="56" alt="Keyway" />
      <div class="name">Keyway</div>
      <div class="tagline" data-i18n="login.tagline">LLM Routing Gateway</div>
    </div>
    <h1 data-i18n="login.title">Admin Login</h1>
    <p class="subtitle" data-i18n="login.subtitle">Enter your admin token to access the management UI.</p>
    <form id="login-form">
      <label for="token" data-i18n="login.token">Admin Token</label>
      <input type="password" id="token" name="token" data-i18n-placeholder="login.placeholder" placeholder="Paste your KEYWAY_ADMIN_TOKEN here" required autocomplete="off" />
      <button type="submit" data-i18n="login.submit">Login</button>
      <div class="status" id="status"></div>
    </form>
    <p class="hint" data-i18n="login.hint">
      The admin token is set via KEYWAY_ADMIN_TOKEN in your .env. If not set, a random token is generated and printed to the console on startup. Desktop mode skips this screen on loopback.
    </p>
  </div>
  <script type="module">
    const form = document.getElementById("login-form");
    const status = document.getElementById("status");
    const langSel = document.getElementById("login-lang");

    async function bootstrapLang() {
      let lang = window.KeywayI18n ? KeywayI18n.loadStoredLanguage() : "en";
      try {
        const resp = await fetch("/admin/ui-locale");
        if (resp.ok) {
          const data = await resp.json();
          if (data.language) lang = data.language;
        }
      } catch (_) {}
      if (window.KeywayI18n) KeywayI18n.setLanguage(lang);
      if (langSel) langSel.value = window.KeywayI18n ? KeywayI18n.getLanguage() : lang;
    }

    langSel?.addEventListener("change", () => {
      if (window.KeywayI18n) KeywayI18n.setLanguage(langSel.value);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = document.getElementById("token").value;
      status.textContent = "";
      try {
        const resp = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (resp.ok) {
          window.location.href = "/admin.html";
        } else {
          const data = await resp.json().catch(() => ({}));
          status.textContent = data.detail || "Login failed";
        }
      } catch (err) {
        status.textContent = "Network error: " + err.message;
      }
    });

    bootstrapLang();
  </script>
</body>
</html>
